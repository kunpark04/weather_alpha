# Weather-Alpha LIVE engine config (Option-A directional strategy).
# Paths are relative to the process working directory (systemd sets it to ~/weather-alpha).
# `mode` here is the resident default; CLI --paper/--live/--dry-run overrides it.

bankroll_init        = 250.0      # per-market starting bankroll (high and low are independent)
mode                 = "paper"
state_path           = "data/wa_engine/state.json"
log_path             = "data/wa_engine/log.jsonl"
kill_switch_path     = "data/wa_engine/KILL_SWITCH"
key_id_env           = "KALSHI_KEY_ID"            # only read in --live
private_key_path_env = "KALSHI_PRIVATE_KEY_PATH"  # only read in --live
anchor_window_min    = 60         # process an anchor within 60 min; no off-anchor catch-up after
poll_interval_sec    = 300
live_alloc_frac      = 1.0         # LIVE only: fraction of the REAL Kalshi balance to size off
                                   # (single shared bankroll for both markets). Set at deploy; 1.0 =
                                   # whole account. Paper/dry-run ignore it (use bankroll_init).
total_exposure_max_pct = 1.0       # cap on total OPEN cost as a fraction of the bankroll (account-wide
                                   # live / per-market paper). Backstop beyond daily_cap; tighten to taste.
heartbeat_path       = "data/wa_engine/heartbeat"      # G9: touched each loop for an external watchdog
alert_path           = "data/wa_engine/alerts.jsonl"   # G10: critical-alert sink (tail + push externally)
canary_trades        = 3           # G11: cap the first N LIVE fills to canary_max_contracts each (0=off)
canary_max_contracts = 1           # G11: contracts per canary fill
daily_max_loss_usd   = 0.0         # G12: account-wide daily realized-loss stop (USD); 0 = disabled

[algo]
band_lo        = 0.93
band_hi        = 0.95
daily_cap      = 3      # max entries per market per event-date (the "top-3" cap)
stake_fraction = 0.50   # total fraction of bankroll across the day's cap slots
cap_price      = 0.97   # walk the ask ladder only up to this price

# --- cities (series prefixes + IANA tz). NYC has no KXLOWT low series -> series_low = "". ---
