[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weather-alpha"
version = "0.1.0"
description = "Probabilistic ML forecaster + Kalshi KXHIGHCHI trading engine (KMDW daily-high)."
requires-python = ">=3.11"
readme = "README_PROD.md"
authors = [{ name = "kunpark04" }]
license = { text = "Proprietary" }

dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "joblib>=1.3",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "cryptography>=42",
    "textual>=0.60",
    "rich>=13.7",
    "metar>=1.11",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
data = ["herbie-data>=2024.5", "xarray>=2024.3", "cfgrib>=0.9", "requests>=2.31"]
dev  = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
weather-alpha = "weather_alpha.main:run"

[tool.setuptools.packages.find]
include = ["weather_alpha*"]
exclude = ["notebooks*", "archive*", "data*", "tests*"]

[tool.ruff]
line-length = 100
target-version = "py311"
