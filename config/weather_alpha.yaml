# weather_alpha — default configuration.
# Override per-environment via $WEATHER_ALPHA_CONFIG=/path/to/custom.yaml.

mode: paper                       # paper | live  (LIVE requires Kalshi credentials)
station: KMDW
local_tz: America/Chicago

paths:
  data_dir: data
  model_dir: data/model_v3_artifacts
  live_log: data/live_log.parquet
  positions_snapshot: data/positions.json
  notebook_v3: notebooks/model_v3.ipynb
  logs_dir: logs
  kill_switch: data/KILL_SWITCH
  scheduler_state: data/scheduler_state.json   # persisted so a restart doesn't re-fire the day's anchor

model:
  name: v3
  anchor_hour_local: 13           # T = 1 PM local
  enabled: false                  # model-free: market_wing ignores the model -> skip weather/features/predict.
                                  #   set true only for a model-anchored strategy (e.g. wing + agreement).

strategy:
  name: market_wing               # engine dispatch: market_wing | wing | wing_any | joint_kelly
  bankroll_usd: 25.0              # real Kalshi account balance (starting)
  kelly_fraction: 0.25            # quarter-Kelly (only used if a wing falls back to Kelly sizing)
  wing:                           # wing knobs — see weather_alpha/config.py:WingCfg
    drop_lower_ask: true
    require_agreement: false      # market_wing = market anchor, no agreement gate
    anchor: market
    assumed_win_prob: 0.92
    max_ask_sum: 0.90             # tighter than 1.0: skip fee-dead high-cost days at $25
    sizing_mode: equal_payout
    flat_usd: 2.5                 # flat-$ total per trade (overrides Kelly); 0 = use Kelly
    fee_aware: true
  kl_concentration_alpha: 1.0     # weight on KL contribution per bucket
  edge_floor_cents: 1             # min net-of-fee edge to take a position
  per_contract_max_pct: 0.20      # cap per-contract exposure (frac of bankroll)
  total_exposure_max_pct: 0.60    # cap total exposure (frac of bankroll)
  regime_throttle:
    hrrr_persistence_gap_max_f: 8 # |HRRR_t2m_max - cli_yesterday| > N => halve sizing
    confidence_floor_top1: 0.20   # top-1 bucket prob < N => halve sizing

execution:
  fill_model: ask                 # paper fill: ask | mid | bid
  slippage_cents: 0
  intraday_refresh_minutes: 60
  market_event_pattern: KXHIGHCHI

kalshi:
  api_base: https://api.elections.kalshi.com/trade-api/v2
  key_id_env: KALSHI_KEY_ID
  private_key_path_env: KALSHI_PRIVATE_KEY_PATH
  rest_poll_seconds: 30
  request_timeout_seconds: 15

data:
  # ASOS source. Real-time options:
  #   synoptic           sub-minute via Synoptic Mesonet (needs SYNOPTIC_TOKEN)
  #   metar_substitute   real-time METAR (api.weather.gov) coerced into ASOS schema
  # Lagged option:
  #   iem                IEM 1-min ASOS, 24-48h lag (matches training, but blocks same-day anchor)
  # auto = synoptic if token set, else metar_substitute.
  asos_source: auto
  synoptic_token_env: SYNOPTIC_TOKEN
  # Live-fetch windows (per source)
  metar_obs_limit: 40             # api.weather.gov observations to pull
  taf_hours_back: 36
  asos_hours_back: 48
  cli_days_back: 30
  hrrr_publish_lag_min: 90        # how long after init we treat an HRRR run as safely published

scheduler:
  anchor_grace_minutes: 5         # wait N minutes past anchor before reading features
  data_refresh_minutes: 15
  predict_lookback_hours: 2       # how far back to consider running an anchor if missed

risk:
  daily_max_loss_usd: 100.0       # tripping this halts new entries for the rest of the day
  per_anchor_max_trades: 6        # never more than the natural 6-contract count

ui:
  refresh_hz: 4
  theme: dark
